<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .price {
      color: black;
      font-family: Arial;
      font-size: 30px;
    }
    .currency {
      font-size: 20px;
      font-family: Arial;
      color: grey;
    }
    p {
      font-family: Arial;
      color: green;
    }
    .date {
      font-family: Arial;
      color: grey;
    }
    .deg {
      font-family: Arial;
      color: red;
    }
  </style>
  <body>
    <p class="price">1,049.61 <span class="currency"> USD</span></p>
    <p>+18.05 (1.75%) today</p>
    <p class="date">
      After hours 1,048.00 <span class="deg">-1.61(0.15%)</span>
    </p>
  </body>
</html>
