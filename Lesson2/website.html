<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .Subscribe {
        background-color: red;
        color: rgb(255, 255, 255);
        height: 36px;
        width: 105px;
        border: none;
        border-radius: 2px;
        margin-right: 20px;
        cursor: pointer;
      }
      .Join {
        background-color: white;
        color: rgb(69, 139, 220);
        height: 36px;
        width: 105px;
        border: none;
        border-radius: 2px;
        margin-right: 20px;
        cursor: pointer;
      }
      .Teweeter {
        background-color: rgb(36, 12, 193);
        color: rgb(255, 255, 255);
        height: 36px;
        width: 105px;
        border: none;
        font-size: 15px;
        border-style: solid;
        border-radius: 2px;
        margin-right: 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button class="Subscribe">Subscribe</button>
    <button class="Join">Join</button>
    <button class="Teweeter">Teweeter</button>
  </body>
</html>
