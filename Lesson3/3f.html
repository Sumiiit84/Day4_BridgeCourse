<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a {
        color: rgb(0, 113, 133);
      }
      a:hover {
        color: chocolate;
      }
      h1 {
        color: black;
      }
      .p1 {
        color: rgb(0, 118, 0);
      }
      .btn1 {
        background-color: rgb(255, 216, 20);
        color: black;
        width: 100px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        margin-right: 20px;
        border-radius: 20px;
      }
      .btn2 {
        background-color: rgb(255, 164, 28);
        color: black;
        width: 100px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        margin-right: 20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <script>
      function showText() {
        document.getElementById("msg1").innerText = "clicked!";

        setTimeout(function () {
          document.getElementById("msg1").innerText = "";
        }, 3000);
      }
    </script>
    <a href="https://www.amazon.com">Back to Amazon</a>
    <br />
    <h1>Nike Black Running Shoes</h1>
    <br />
    <p class="p1">$39- in stock</p>
    <br />
    <p class="p2">Free Delivery Tomorrow</p>
    <br />
    <button class="btn1" onclick="showText()">Add to Cart</button>
    <button class="btn2" onclick="showText()">Buy now</button>
    <br />
    <p id="msg1"></p>
  </body>
</html>
