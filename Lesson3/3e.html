<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .btn1 {
        background-color: rgb(27, 104, 236);
        color: rgb(254, 253, 253);
        width: 150px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        margin-right: 20px;
        font-weight: bolder;
        cursor: pointer;
        width: 150px;
        border-radius: 20px;
      }
      .btn1:hover {
        background-color: rgb(24, 24, 155);
      }
      .btn2 {
        background-color: rgb(241, 241, 237);
        color: rgb(38, 99, 165);
        width: 150px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        margin-right: 20px;
        cursor: pointer;
        border-radius: 20px;
      }
      .btn2:hover {
        border: 2px solid rgb(26, 141, 212);
      }
    </style>
  </head>
  <body>
    <button class="btn1">Apply on Company Website</button>
    <button class="btn2">Save</button>
  </body>
</html>
