<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .btn {
        background-color: rgb(17, 128, 202);
        color: white;
        border: none;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 10px;
        font-weight: bolder;
        margin-left: 8px;
        transition: box-shadow 0.15s;
        font-size: 25px;
        cursor: pointer;
      }

      .btn:hover {
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <button class="btn">Tweet</button>
  </body>
</html>
