<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .btn1 {
        background-color: rgb(21, 107, 192);
        color: white;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 20px;
        padding-right: 20px;
        font-size: 18px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        margin-right: 8px;
        transition: background-color 0.1s;
      }

      .btn1:hover {
        background-color: rgb(9, 90, 171);
      }

      .btn2 {
        background-color: white;
        color: rgb(12, 83, 155);
        border-width: 1px;
        border-style: solid;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 20px;
        padding-right: 20px;
        font-weight: bold;
        font-size: 18px;
        border-color: rgb(10, 102, 194);
        border-radius: 30px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-width 0.1s,
          padding 0.15s;
      }

      .btn2:hover {
        background-color: rgb(136, 149, 161);
        border-width: 4px;
        padding-top: 11px;
        padding-bottom: 11px;
        padding-left: 20px;
        padding-right: 20px;
      }
    </style>
  </head>
  <body>
    <button class="btn1">Apply on company website</button>

    <button class="btn2">Save</button>
  </body>
</html>
