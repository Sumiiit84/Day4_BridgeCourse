<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .btn {
        background-color: rgb(26, 124, 73);
        color: white;
        border: none;
        padding-top: 10px;
        padding-right: 15px;
        padding-bottom: 10px;
        padding-left: 15px;
        font-weight: bolder;
        border-radius: 6px;
        font-size: 25px;
        cursor: pointer;
        transition: box-shadow 0.5s;
      }
      .btn:hover {
        box-shadow: 0px 6px 10px rgba(1, 0, 1, 0.5);
      }
    </style>
  </head>
  <body>
    <button class="btn">Sign up</button>
  </body>
</html>
