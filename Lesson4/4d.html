<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .btn1 {
        background-color: rgb(121, 42, 179);
        color: white;
        border: none;
        padding-top: 8px;
        padding-bottom: 8px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        margin-right: 10px;
        transition: background-color 0.1s;
      }

      .btn1:hover {
        background-color: rgb(99, 60, 156);
      }

      .btn2 {
        background-color: white;
        color: rgb(108, 117, 125);
        border-width: 1px;
        border-color: rgb(108, 117, 125);
        padding-bottom: 12px;
        padding-left: 10px;
        padding-right: 10px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition:
          background-color 0.1s,
          color 0.15s;
      }

      .btn2:hover {
        background-color: rgb(102, 117, 125);
        color: white;
      }
    </style>
  </head>
  <body>
    <button class="btn1">Get started</button>

    <button class="btn2">Download</button>
  </body>
</html>
